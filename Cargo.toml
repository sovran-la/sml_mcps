[package]
name = "sml_mcps"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Small MCP Server - sync, no tokio, just works"
license = "MIT"
repository = "https://github.com/MemoryCo/sml_mcps"
readme = "README.md"
keywords = ["mcp", "server", "sync", "claude", "anthropic"]
categories = ["network-programming", "api-bindings"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
base64 = "0.22"

# JSON Schema generation for tools
schemars = { version = "1.0", optional = true }

# JWT validation for hosted auth
jsonwebtoken = { version = "9", optional = true }

# TLS for the HTTP server. Pure Rust, and only pulled in by the `tls` feature -
# most deployments terminate TLS at a proxy and should not pay for it.
rustls = { version = "0.23", optional = true, default-features = false, features = [
    "std",
    "ring",
    "tls12",
    "logging",
] }
rustls-pemfile = { version = "2", optional = true }
boon = "0.6"
getrandom = "0.3"

# The HTTP/1.1 request-line and header parser. Zero dependencies, zero async,
# `#![no_std]`-capable, and the parser hyper has been running in production for
# a decade - which is the entire argument for it over the hand-written one it
# replaces. Only pulled in by the `http` feature.
httparse = { version = "1.10", optional = true }

# Unix daemon syscalls (fork, setsid, dup2, kill) for UnixServer::serve_daemon.
# Unix-only, always available there - no feature flag (matches #[cfg(unix)] gating).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["schema"]
schema = ["dep:schemars"]
# The HTTP/1.1 server is ours, on std::net: the connection loop, the framing,
# the ceilings and the deadlines. The one thing it does not hand-write is the
# request-line and header parser, which is `httparse` - one crate, no
# transitive dependencies. See src/transport/http1.rs for both halves of that.
http = ["dep:httparse"]
auth = ["dep:jsonwebtoken"]
hosted = ["http", "auth"]
# HTTPS via rustls. Pure Rust - no system OpenSSL - and off by default,
# because most deployments terminate TLS at a proxy and should not pay for it.
tls = ["http", "dep:rustls", "dep:rustls-pemfile"]

[dev-dependencies]

[[example]]
name = "simple"

[[example]]
name = "http_server"
required-features = ["http"]

[[example]]
name = "http_auth"
required-features = ["hosted"]

# Unix socket daemon/shim example - unix-only, no extra features needed
[[example]]
name = "unix_server"
